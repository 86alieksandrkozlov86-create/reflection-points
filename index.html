<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#060913;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8ecff}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#panel{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(10,14,30,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #1f2a50;transition:transform .25s;z-index:4}
#panel.hidden{transform:translateY(110%)}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
button,select{background:#18213f;color:#e8ecff;border:1px solid #2d3b6e;border-radius:10px;padding:8px 10px;font-size:14px}
button:active{background:#2a3a72}
.row button.grow{flex:1}
select{flex:1;min-width:0}
label{font-size:13px;display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
label.chk{flex:0 0 auto;min-width:0;margin-right:6px}
input[type=range]{flex:1;min-width:60px;accent-color:#5ff0ff}
input[type=checkbox]{width:18px;height:18px;accent-color:#5ff0ff}
.val{min-width:32px;text-align:right;font-variant-numeric:tabular-nums;color:#ffd84a}
#show{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;display:none}
#hint{font-size:11px;opacity:.6;margin-top:2px}
#tb{position:fixed;left:8px;top:120px;z-index:5;background:rgba(10,14,30,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #2d3b6e;border-radius:14px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.5);touch-action:none;user-select:none}
#tbHead{display:flex;align-items:center;gap:2px}
#tbGrip{cursor:grab;padding:6px 3px;opacity:.6;font-size:16px;touch-action:none}
#tbToggle{width:40px;height:40px;padding:0;font-size:19px;border-radius:10px}
#tbBody{display:flex;flex-direction:column;gap:5px;margin-top:5px}
#tb:not(.open) #tbBody{display:none}
#tbBody button{width:58px;padding:5px 0 4px;font-size:18px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:1px}
#tbBody small{font-size:10px;opacity:.8}
#tbBody .tool.on{background:#1d5a73;border-color:#5ff0ff;box-shadow:0 0 10px rgba(95,240,255,.35)}
#toast{position:fixed;left:50%;top:118px;transform:translateX(-50%);max-width:92vw;background:rgba(20,30,60,.92);border:1px solid #2d3b6e;border-radius:12px;padding:8px 12px;font-size:13px;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#fab{position:fixed;right:8px;top:120px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 6px 5px;border-radius:16px;background:rgba(10,14,30,.88);border:1px solid #2fd47e;box-shadow:0 0 14px rgba(47,212,126,.35);font-size:10px}
#fab img{width:46px;height:46px;border-radius:11px;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modalBox{position:relative;background:#0d1430;border:1px solid #2d3b6e;border-radius:18px;padding:20px 18px 18px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#modalBox h3{font-size:18px;margin-bottom:12px}
#modalBox p{font-size:14px;line-height:1.45;margin:8px 0;opacity:.9}
#modalClose{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%}
.shareGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.shareGrid a,.shareGrid button{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;border-radius:12px;font-size:15px;text-decoration:none;color:#fff;border:1px solid #2d3b6e;background:#18213f}
.shareGrid .tg{background:#2aa3df;border-color:#2aa3df}
.shareGrid .wa{background:#25d366;border-color:#25d366;color:#05210f}
.shareGrid .vb{background:#7360f2;border-color:#7360f2}
.shareGrid .wide{grid-column:1/3}
#modalBox{max-height:92vh;overflow:auto}
.fld{display:block;font-size:12px;opacity:.8;margin:10px 0 4px}
.inp{width:100%;padding:10px;border-radius:10px;border:1px solid #2d3b6e;background:#060913;color:#e8ecff;font-size:15px}
.chkl{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:10px 0;min-width:0}
#pubLog{font-size:13px;line-height:1.6;margin-top:10px;white-space:pre-wrap}
#pubLog .ok{color:#7dff9a}#pubLog .err{color:#ff8a8a}
.btnMain{width:100%;margin-top:12px;padding:13px;font-size:16px;border-radius:12px;background:#1d7a4a;border-color:#2fd47e;color:#fff}
.btnLink{display:block;text-align:center;text-decoration:none;color:#fff;padding:11px;border-radius:12px;border:1px solid #2d3b6e;background:#18213f;margin-top:8px;font-size:14px}
#linkBox{width:100%;margin-top:10px;padding:9px;border-radius:10px;border:1px solid #2d3b6e;background:#060913;color:#9fe9ff;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="show">☰</button>
<div id="tb" class="open">
  <div id="tbHead"><span id="tbGrip" title="Перетягнути">⠿</span><button id="tbToggle" title="Згорнути / розгорнути">🛠</button></div>
  <div id="tbBody">
    <button class="tool on" data-t="points" title="Рухати точки A і B">✋<small>Точки</small></button>
    <button class="tool" data-t="shape" title="Своя фігура">✏️<small>Фігура</small></button>
    <button class="tool" data-t="line" title="Пряма лінія">📏<small>Лінія</small></button>
    <button class="tool" data-t="curve" title="Крива лінія">〰<small>Крива</small></button>
    <button class="tool" data-t="obst" title="Перешкода">⬟<small>Перешк.</small></button>
    <button id="undo" title="Скасувати останню лінію">↶<small>Назад</small></button>
    <button id="clear" title="Видалити всі лінії">🗑<small>Очист.</small></button>
  </div>
</div>
<button id="fab" title="Встановити на головний екран"><img id="fabImg" alt=""><span>Встановити</span></button>
<div id="toast"></div>
<div id="modal"><div id="modalBox"><button id="modalClose">✕</button><div id="modalBody"></div></div></div>
<div id="panel">
  <div class="row">
    <button id="prev">◀</button>
    <select id="shape"></select>
    <button id="next">▶</button>
    <button id="hide">▾</button>
  </div>
  <div class="row">
    <button class="grow" id="rndPts">🎲 Точки</button>
    <button class="grow" id="rndShape">🎲 Фігура</button>
    <button class="grow" id="preset">🎯 Фокус</button>
    <button class="grow" id="rec">🎬 Запис</button>
  </div>
  <div class="row">
    <button class="grow" id="installBtn">📲 На головний екран</button>
    <button class="grow" id="shareBtn">📤 Поділитися</button>
  </div>
  <div class="row">
    <label>Кульки <input type="range" id="n" min="1" max="200" value="21"><span class="val" id="nv">21</span></label>
    <label>Швидкість <input type="range" id="sp" min="1" max="10" value="5"><span class="val" id="spv">5</span></label>
  </div>
  <div class="row" id="spreadRow">
    <label>Розкид° <input type="range" id="spread" min="10" max="360" value="160"><span class="val" id="spreadv">160</span></label>
  </div>
  <div class="row">
    <select id="mode">
      <option value="exact" selected="">Дзеркальне відбиття → в точку B</option>
      <option value="free">Вільне дзеркальне відбиття</option>
      <option value="converge">Сходження (не дзеркальне)</option>
    </select>
  </div>
  <div class="row" id="maxbRow">
    <label>Відбиттів за цикл <input type="range" id="maxb" min="1" max="20" value="3"><span class="val" id="maxbv">3</span></label>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="grow"> +1 кулька щоциклу</label>
    <button id="minus1">−1</button><button id="plus1">+1</button>
    <label class="chk"><input type="checkbox" id="autoRnd"> Рандом щоциклу</label>
    <label class="chk"><input type="checkbox" id="demo"> Авто-демо</label>
  </div>
  <div class="row">
    <select id="snd" style="flex:1.4">
      <option value="off">🔇 Звук вимкнено</option>
      <option value="billiard">🎱 Більярдні кулі</option>
      <option value="pingpong">🏓 Настільний теніс</option>
      <option value="bell">🔔 Дзвіночок</option>
      <option value="xylo">🎵 Ксилофон</option>
      <option value="drop">💧 Краплі води</option>
    </select>
    <label style="min-width:110px">Гучн. <input type="range" id="vol" min="0" max="100" value="70"></label>
  </div>
  <div id="hint"></div>
</div>

cv.addEventListener('pointerdown', e => {

  const p = toUnit(e);

  }

/* ---------- публікація цього файлу на GitHub Pages прямо з телефону ---------- */
const GH_DEFAULT = { owner: '86alieksandrkozlov86-create', repo: 'reflection-points' };
function ghSaved() { try { return Object.assign({}, GH_DEFAULT, JSON.parse(localStorage.getItem('ghTarget') || '{}')); } catch (e) { return GH_DEFAULT; } }
function publishDialog() {
  const g = ghSaved();
  modal(`<h3>📲 На головний екран</h3>
    <p>Щоб встановити застосунок, його треба один раз зберегти на ваш GitHub. Файл зробить це сам.</p>
    <label class="fld">Логін GitHub</label><input class="inp" id="ghOwner" value="${g.owner}" autocapitalize="off" autocomplete="off" spellcheck="false">
    <label class="fld">Репозиторій</label><input class="inp" id="ghRepo" value="${g.repo}" autocapitalize="off" autocomplete="off" spellcheck="false">
    <label class="fld">Токен GitHub</label>
    <a class="btnLink" href="https://github.com/settings/tokens/new?scopes=repo&description=Tochky-peretynu" target="_blank" rel="noopener">🔑 1. Згенерувати токен на GitHub</a>
    <p style="font-size:12px;opacity:.75">Відкриється GitHub: прокрутіть донизу → <b>Generate token</b> → скопіюйте код (починається з <b>ghp_</b>) і поверніться сюди.</p>
    <input class="inp" id="ghToken" type="password" placeholder="2. Вставте токен сюди: ghp_..." autocapitalize="off" autocomplete="off" spellcheck="false">
    <label class="chkl"><input type="checkbox" id="ghPublic" checked> <span>Зробити репозиторій публічним — без цього безкоштовний GitHub Pages не працює</span></label>
    <button class="btnMain" id="ghGo">⬆️ 3. Зберегти на GitHub і встановити</button>
    <div id="pubLog"></div>
    <p style="font-size:11px;opacity:.55;margin-top:10px">Токен ніде не зберігається і надсилається тільки на api.github.com.</p>`);
  $('ghGo').onclick = publishToGitHub;
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function publishToGitHub() {
  const owner = $('ghOwner').value.trim(), repo = $('ghRepo').value.trim(), token = $('ghToken').value.trim();
  const log = $('pubLog'), btn = $('ghGo');
  const say = (t, cls) => { log.innerHTML += `<div class="${cls || ''}">${t}</div>`; };
  log.innerHTML = '';
  if (!owner || !repo) { say('Вкажіть логін і репозиторій', 'err'); return; }
  if (!token) { say('Спершу згенеруйте і вставте токен', 'err'); return; }
  try { localStorage.setItem('ghTarget', JSON.stringify({ owner, repo })); } catch (e) {}
  const api = (path, opt = {}) => fetch('https://api.github.com' + path, Object.assign({}, opt, {
    headers: Object.assign({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opt.body ? { 'Content-Type': 'application/json' } : {})
  }));
  btn.disabled = true; btn.textContent = '⏳ Працюю...';
  try {
    // 1. перевірка токена
    let r = await api('/user');
    if (r.status === 401) throw new Error('Токен неправильний або прострочений — згенеруйте новий');
    if (!r.ok) throw new Error('GitHub відповів помилкою ' + r.status);
    const me = await r.json(); say('✔ Вхід: ' + me.login, 'ok');
    // 2. репозиторій (створити, якщо немає)
    r = await api(`/repos/${owner}/${repo}`);
    let info;
    if (r.status === 404) {
      if (me.login.toLowerCase() !== owner.toLowerCase()) throw new Error('Репозиторій не знайдено');
      r = await api('/user/repos', { method: 'POST', body: JSON.stringify({ name: repo, private: !$('ghPublic').checked, description: 'Точки перетину — симуляція дзеркальних відбиттів' }) });
      if (!r.ok) throw new Error('Не вдалося створити репозиторій (' + r.status + ')');
      info = await r.json(); say('✔ Створено репозиторій ' + repo, 'ok');
    } else if (r.ok) { info = await r.json(); say('✔ Репозиторій знайдено', 'ok'); }
    else throw new Error('Немає доступу до репозиторію (' + r.status + '). Чи має токен галочку «repo»?');
    // 3. публічний
    if (info.private && $('ghPublic').checked) {
      r = await api(`/repos/${owner}/${repo}`, { method: 'PATCH', body: JSON.stringify({ private: false }) });
      if (!r.ok) throw new Error('Не вдалося зробити репозиторій публічним (' + r.status + ')');
      info = await r.json(); say('✔ Репозиторій тепер публічний', 'ok');
    } else if (info.private) say('⚠ Репозиторій приватний — Pages може не запрацювати', 'err');
    // 4. завантаження файлу
    const branch = info.default_branch || 'main';
    let sha;
    r = await api(`/repos/${owner}/${repo}/contents/index.html?ref=${encodeURIComponent(branch)}`);
    if (r.ok) sha = (await r.json()).sha;
    r = await api(`/repos/${owner}/${repo}/contents/index.html`, { method: 'PUT', body: JSON.stringify(Object.assign({ message: 'Точки перетину: оновлення з телефону', content: b64utf8(SELF_HTML), branch }, sha ? { sha } : {})) });
    if (!r.ok && r.status === 404 && !sha) r = await api(`/repos/${owner}/${repo}/contents/index.html`, { method: 'PUT', body: JSON.stringify({ message: 'Точки перетину', content: b64utf8(SELF_HTML) }) });
    if (!r.ok) throw new Error('Не вдалося зберегти файл (' + r.status + ')');
    const put = await r.json(); const usedBranch = (put.commit && branch) || branch;
    say('✔ Файл index.html збережено', 'ok');
    // 5. GitHub Pages
    r = await api(`/repos/${owner}/${repo}/pages`);
    if (r.status === 404) {
      r = await api(`/repos/${owner}/${repo}/pages`, { method: 'POST', body: JSON.stringify({ source: { branch: usedBranch, path: '/' } }) });
      if (!r.ok && r.status !== 409) throw new Error('Не вдалося увімкнути GitHub Pages (' + r.status + ')');
      say('✔ GitHub Pages увімкнено', 'ok');
    } else say('✔ GitHub Pages вже увімкнено', 'ok');
    const site = `https://${owner.toLowerCase()}.github.io/${repo}/`;
    // 6. чекаємо збірку сайту
    say('⏳ GitHub збирає сайт (зазвичай 1–2 хв)...');
    let built = false;
    for (let i = 0; i < 40 && !built; i++) {
      await new Promise(res => setTimeout(res, 5000));
      const b = await api(`/repos/${owner}/${repo}/pages/builds/latest`);
      if (b.ok) { const j = await b.json(); if (j.status === 'built') built = true; else if (j.status === 'errored') throw new Error('Помилка збірки сайту на GitHub'); }
    }
    say(built ? '✅ Готово!' : '⚠ Збірка ще триває — відкрийте посилання за хвилину', built ? 'ok' : '');
    log.innerHTML += `<a class="btnLink" style="background:#1d7a4a;border-color:#2fd47e" href="${site}" target="_blank" rel="noopener">🚀 Відкрити і встановити</a>
      <p style="font-size:12px;opacity:.8">На сторінці натисніть <b>📲 На головний екран</b> ще раз — з'явиться вікно встановлення. Адреса для друзів:<br><b>${site}</b></p>`;
    btn.textContent = '✅ Збережено';
  } catch (e) {
    say('✖ ' + (e.message || e), 'err');
    btn.disabled = false; btn.textContent = '⬆️ 3. Зберегти на GitHub і встановити';
  }
}
const SHARE_TEXT = 'Чи влучать усі в одну точку? 🎯 Симуляція дзеркальних відбиттів — спробуй сам:';
const FILE_NAME = 'tochky-peretynu.html';

function downloadSelf() {
